limit_req_zone $binary_remote_addr zone=qvex_kill_limit:10m rate=1r/s;

server {
    listen 80;
    server_name _; # Замените на ваш домен или IP сервера

    # Защита фрейма TMA от встраивания в чужие сайты
    add_header X-Frame-Options "ALLOW-FROM https://web.telegram.org";
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://webz.telegram.org;";

    # Эндпоинт Kill-Switch с защитой от флуда
    location /api/kill {
        limit_req zone=qvex_kill_limit burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Все остальные запросы и статика
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
